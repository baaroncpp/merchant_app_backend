services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: wendi
      POSTGRES_USER: wendi
      POSTGRES_PASSWORD: wendi
    ports: ["127.0.0.1:5432:5432"]
    volumes: [wendi-pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
volumes:
  wendi-pg: {}
