# Local Postgres and Redis for the dev profile (application-dev.yml points here).
#   docker compose -f compose.dev.yaml up -d
#   ./gradlew bootRun                 # dev profile is the default
# Seeded users: 0772000001 (owner, John Kato) and 0772000002 (operator, Grace Namuli), PIN 1357.
# A new phone gets a 6-digit device code: it is printed in the app log ("DEV device code for ...").
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: wendi
      POSTGRES_USER: wendi
      POSTGRES_PASSWORD: wendi        # local only; servers use secrets
    ports: ["127.0.0.1:5432:5432"]
    volumes: [wendi-pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
volumes:
  wendi-pg: {}
