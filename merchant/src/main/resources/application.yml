spring:
  application:
    name: merchant-backend
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

server:
  port: 4040

app:
  token-duration: ${TOKEN_DURATION:15}
  refresh-token-duration: ${REFRESH_TOKEN_DURATION:30}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:4040}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
